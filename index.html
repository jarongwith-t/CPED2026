<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>สมัครแข่งขันทักษะวิชาการระดับประถมศึกษา</title>
<style>
:root{--p:#5b45d6;--bg:#f0edfa}*{box-sizing:border-box}
body{margin:0;font-family:'Sarabun','Noto Sans Thai',sans-serif;background:var(--bg);color:#222}
header{background:var(--p);color:#fff;padding:20px;text-align:center}header h1{margin:0;font-size:1.25rem}header p{margin:4px 0 0;opacity:.85}
nav{display:flex;justify-content:center;gap:8px;padding:12px}nav button{padding:10px 22px;border:0;border-radius:20px;background:#fff;cursor:pointer;font:inherit}nav button.on{background:var(--p);color:#fff}
main{max-width:780px;margin:0 auto;padding:0 12px 40px}.card{background:#fff;border-radius:10px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px #0002}
.lv{background:var(--p);color:#fff;border-radius:10px;padding:12px 16px;margin:16px 0 8px;font-weight:700}
label{display:block;font-weight:600;margin:8px 0 4px}label i{color:#c00}
input,select{width:100%;padding:10px;border:1px solid #bbb;border-radius:6px;font:inherit}
.ev{display:flex;align-items:center;gap:8px;font-weight:700;cursor:pointer}.ev input{width:auto}
.body{margin-top:8px}.row{display:flex;gap:8px;margin-bottom:8px}.row>*:nth-child(1){flex:0 0 110px}.row.t>*:nth-child(1){flex:0 0 110px}
small{color:#666}.btn{background:var(--p);color:#fff;border:0;padding:12px 28px;border-radius:6px;font:inherit;cursor:pointer}.btn:disabled{opacity:.5}
table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #ddd;text-align:left}th{background:#e8e4fa}
.msg{padding:12px;border-radius:6px;margin-top:10px}.ok{background:#e0f5e4}.er{background:#fde4e4}.hide{display:none}
@media(max-width:560px){.row{flex-wrap:wrap}.row>*{flex:1 1 45%!important}}
</style></head><body>
<header><h1>แบบฟอร์มการสมัครเข้าร่วมการแข่งขันทักษะวิชาการระดับประถมศึกษา</h1><p>วันการศึกษาเอกชน สมาคมโรงเรียนเอกชน ระดับประถมศึกษา</p></header>
<nav><button id="b1" class="on" onclick="tab(1)">สมัครแข่งขัน</button><button id="b2" onclick="tab(2)">ประกาศผล</button></nav>
<main>
<section id="p1"><form id="f" onsubmit="return send(event)">
<div class="card"><label>อีเมล <i>*</i></label><input type="email" id="email" required>
<label>โรงเรียน <i>*</i></label><input id="school" required>
<small>ส่งใบสมัครซ้ำด้วยโรงเรียนเดิมได้ ระบบจะใช้ข้อมูลล่าสุดแทนของเดิมในแต่ละรายการ</small></div>
<div id="levels"></div>
<button class="btn" id="sub">ส่งใบสมัคร</button><div id="m" class="msg hide"></div>
</form></section>
<section id="p2" class="hide"><div class="card">
<div class="row" style="margin:0"><div style="flex:1"><label>ระดับ</label><select id="rl" onchange="showResults()"></select></div>
<div style="flex:1"><label>รายการ</label><select id="re" onchange="showResults()"></select></div></div>
<label>ค้นหาโรงเรียน</label><input id="q" oninput="showResults()">
<div style="overflow-x:auto;margin-top:12px"><table><thead id="rh"></thead><tbody id="rb"></tbody></table></div>
<p id="rn" class="msg hide"></p></div></section>
</main>
<script>
// ===== ตั้งค่า =====
const CFG={
 SCRIPT_URL:'https://script.google.com/macros/s/AKfycbxW2qJLsEhB6ocyXD__AOuZeKoIJhLR9g4B5IovZIGlAumB9ls-U56Y__BBj4EnSEjV/exec',
 prefixes:['เด็กชาย','เด็กหญิง','นาย','นาง','นางสาว'],
 teacherPrefixes:['นาย','นาง','นางสาว','ดร.','อื่นๆ'],
 levels:['ตอนต้น (ป.1-3)','ตอนปลาย (ป.4-6)'],
 events:[{name:'การแข่งขันวาดภาพ ระบายสี',n:1},{name:'Spelling Bee',n:1},{name:'คัดลายมือภาษาไทย',n:1},{name:'เกม 24',n:2}]
};
const $=id=>document.getElementById(id);
function mk(tag,props,kids){const e=document.createElement(tag);Object.assign(e,props||{});(kids||[]).forEach(k=>e.append(k));return e}
function sel(arr){return mk('select',{},arr.map(x=>mk('option',{value:x,textContent:x})))}
function inp(ph){return mk('input',{placeholder:ph})}
const blocks=[];
CFG.levels.forEach(lv=>{
 $('levels').append(mk('div',{className:'lv',textContent:'รายการแข่งขันทักษะวิชาการระดับประถมศึกษา '+lv}));
 CFG.events.forEach(ev=>{
  const cb=mk('input',{type:'checkbox'}),body=mk('div',{className:'body hide'}),students=[];
  for(let i=0;i<ev.n;i++){const s={p:sel(CFG.prefixes),f:inp('ชื่อ'),l:inp('นามสกุล')};students.push(s);
   body.append(mk('label',{textContent:ev.n>1?'ผู้เข้าแข่งขันคนที่ '+(i+1):'ผู้เข้าแข่งขัน'}),mk('div',{className:'row'},[s.p,s.f,s.l]))}
  const t={p:sel(CFG.teacherPrefixes),f:inp('ชื่อ'),l:inp('นามสกุล')};
  body.append(mk('label',{textContent:'ครูผู้ควบคุม '+ev.name}),mk('div',{className:'row t'},[t.p,t.f,t.l]));
  cb.onchange=()=>{body.classList.toggle('hide',!cb.checked);body.querySelectorAll('input').forEach(i=>i.required=cb.checked)};
  $('levels').append(mk('div',{className:'card'},[mk('label',{className:'ev'},[cb,document.createTextNode(ev.name+(ev.n>1?' (ทีมละ '+ev.n+' คน)':''))]),body]));
  blocks.push({lv,ev:ev.name,cb,students,t,body});
 })});
function msg(el,t,ok){el.textContent=t;el.className='msg '+(ok?'ok':'er')}
async function send(e){e.preventDefault();
 const entries=blocks.filter(b=>b.cb.checked).map(b=>({level:b.lv,event:b.ev,
  teacher:b.t.p.value+b.t.f.value.trim()+' '+b.t.l.value.trim(),
  students:b.students.map(s=>s.p.value+s.f.value.trim()+' '+s.l.value.trim())}));
 if(!entries.length)return msg($('m'),'กรุณาเลือกอย่างน้อย 1 รายการ',0),false;
 if(!CFG.SCRIPT_URL.startsWith('http'))return msg($('m'),'ยังไม่ได้ตั้งค่า SCRIPT_URL',0),false;
 $('sub').disabled=true;
 try{await fetch(CFG.SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},
   body:JSON.stringify({email:$('email').value.trim(),school:$('school').value.trim(),entries})});
  msg($('m'),'ส่งใบสมัครแล้ว กรุณาตรวจสอบอีเมลยืนยัน หากไม่ได้รับภายใน 5 นาที ให้ติดต่อผู้จัด',1);$('f').reset();blocks.forEach(b=>b.body.classList.add('hide'))}
 catch(x){msg($('m'),'ส่งไม่สำเร็จ ลองใหม่อีกครั้ง',0)}
 $('sub').disabled=false;return false}
// ===== ประกาศผล =====
function fillSel(s,a){s.innerHTML='';a.forEach(x=>s.append(mk('option',{value:x,textContent:x})))}
fillSel($('rl'),CFG.levels);fillSel($('re'),CFG.events.map(e=>e.name));
let R=[];
function tab(n){$('p1').classList.toggle('hide',n!=1);$('p2').classList.toggle('hide',n!=2);$('b1').classList.toggle('on',n==1);$('b2').classList.toggle('on',n==2);if(n==2)loadResults()}
async function loadResults(){try{R=await (await fetch(CFG.SCRIPT_URL+'?action=results')).json();showResults()}catch(x){msg($('rn'),'โหลดผลไม่สำเร็จ',0)}}
function showResults(){const q=$('q').value.trim().toLowerCase();
 const rows=R.filter(r=>r['ระดับ']===$('rl').value&&r['รายการ']===$('re').value&&(!q||String(r['โรงเรียน']).toLowerCase().includes(q)));
 const cols=['อันดับ','โรงเรียน','คะแนน','รางวัล'];
 $('rh').innerHTML='';$('rh').append(mk('tr',{},cols.map(c=>mk('th',{textContent:c}))));
 $('rb').innerHTML='';rows.forEach(r=>$('rb').append(mk('tr',{},cols.map(c=>mk('td',{textContent:r[c]??''})))));
 $('rn').className=rows.length?'hide':'msg er';$('rn').textContent='ยังไม่มีผลประกาศ หรือไม่พบข้อมูล'}
</script></body></html>
